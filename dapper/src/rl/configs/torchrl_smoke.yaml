defaults:
  - environment: joint_grasp_trained0
  - _self_

seed: 0
log_dir_prefix: ""
log_dir_name: null

smoke:
  frames_per_batch: 24
  iterations: 50

record:
  enabled: false
  # Only this many evenly spaced envs of each batch are recorded.
  num_samples: 5
  max_episodes_per_sample: 1
  write_video: false
  video_stride: 1

hydra:
  run:
    dir: ${run_dir:${log_dir_prefix},${log_dir_name}}
  job:
    chdir: false
